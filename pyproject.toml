[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shap-review-toolkit"
version = "0.0.0.dev0"
description = "Evidence-driven semantic review toolkit for SHAP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
analysis = ["tree-sitter>=0.22", "tree-sitter-python>=0.23"]
test = ["pytest>=8", "ruff>=0.4"]
integration = [
    "numpy>=1.24,<3",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "shap>=0.45",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
]

[project.scripts]
shap-review = "shap_review.cli:main"

[tool.setuptools.packages.find]
include = ["shap_review*", "adapters*"]

[tool.setuptools.package-data]
shap_review = ["resources/evidence/issues/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
